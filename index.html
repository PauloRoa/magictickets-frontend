<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Tickets</title>
</head>

<body class="min-h-screen bg-neutral-900 text-neutral-100">
  <main class="mx-auto max-w-6xl px-6 py-10">
    <div id="app" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <div id="purchase-form-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70" hidden>
    <section id="purchase-form-section" class="w-full max-w-md rounded-lg border border-neutral-800 bg-neutral-900 p-6">
      <h2 class="text-xl font-semibold text-amber-500">Tickets</h2>
      <p id="selected-event-name" class="mt-2 text-neutral-300"></p>
      <form id="purchase-form" class="mt-4 flex items-center gap-3">
        <label for="quantity-input" class="text-sm text-neutral-300">Quantity:</label>
        <input type="number" id="quantity-input" min="1"
          class="w-20 rounded border border-neutral-700 bg-neutral-950 px-2 py-1 text-white" />
        <button type="submit"
          class="rounded bg-amber-500 px-4 py-2 font-medium text-neutral-900 hover:bg-amber-600">Confirm</button>
      </form>
      <p id="purchase-feedback" class="mt-3 text-sm text-neutral-300"></p>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
